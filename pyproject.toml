[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "escoamento-certo"
version = "1.5.0"
description = "Sistema Escoamento Certo - Zeladoria Preventiva e Mobilidade Urbana"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.4",
    "python-multipart==0.0.34"
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.vercel]
entrypoint = "backend/main.py"